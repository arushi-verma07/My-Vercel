<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            justify-content: center;
            margin-left: 80px;
        }

        .bar {
            display: flex;
            
            justify-content: space-between;
            padding: 1px 18px;
            /* background-color: linear-gradient(to right, black, green); */
            background-color: rgb(44, 5, 5);
            color: white;
        }

        .home {
            display: flex;
            align-items: center;
            list-style-type: none;
    
            justify-content: space-between;
            width: 40%;


        }

        .logo {
            display: flex;
            align-items: center;
        
            justify-content: space-between;
            width: 16%;

        }

        .second {
            
            height: 600px;
            background-image: linear-gradient(to right, black, rgb(73, 15, 15));
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;

        }

        .second h1 {
            font-size: 60px;
            margin: 0px 0 8px 75px;
            color: rgb(253, 242, 206);
        }

        .second h4 {
            font-size: 20px;
            margin-left: 80px;
            color: rgb(249, 245, 218);
        }

        .one {
            margin-left: 80px;
            margin-top: 40px;
            height: 35px;
            width: 120px;
            border-radius: 10px;
            background: rgb(44, 1, 1);
            color: white;
            border-color: none;
        }

        .two {
            margin-left: 30px;
            height: 35px;
            width: 100px;
            border-radius: 10px;
            background: none;
            color: white;

        }

        .img {
            width: 400px;
            height: auto;
            position: absolute;
            right: 80px;
            top: 38%;
            transform: translateY(-50%);
        }

        .child {
            border: 2px solid rgba(233, 203, 210, 0.925);
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: space-around;
            position: absolute;
            bottom: 10px;
            left: 30px;
            right: 30px;
            border-radius: 20px;
            background-color: rgba(64, 6, 6, 0.521);


        }
    </style>
</head>

<body>
    <header>
        <nav class="bar">
            <div class="logo">
                <h3> Brew Heaven </h3>
            </div>
            <ul class="home">
                <li>
                    <a> Home</a>

                </li>
                <li>
                    <a> Menu</a>
                </li>
                <li>
                    <a> About</a>
                </li>
                <li>
                    <a>Blog</a>
                </li>
                <li>
                    <a> Contact</a>
                </li>
            </ul>

            <div class="logo">

                </svg>
            </div>
        </nav>

        <diV class="second">
            <div class="container">
                <h1> Good Coffee <br> Create Day </h1>
                <h4> Handcrafted wuth love, brewed<br> for your perfect moment.</h4>
                <button class="one"> Explore Menu</button>
                <button class="two">Our Story</button>
            </div>

            <img src="coffee.png" alt="Coffee" class="img">

            <div class="child">

            </div>

        </diV>
    </header>
</body>
